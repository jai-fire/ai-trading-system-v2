# Trading System Configuration

# API Configuration
api:
  binance:
    api_key: "YOUR_BINANCE_API_KEY"
    api_secret: "YOUR_BINANCE_API_SECRET"
    testnet: true  # Use testnet for testing
  
  llm:
    provider: "openai"  # or "anthropic", "cohere"
    api_key: "YOUR_LLM_API_KEY"
    model: "gpt-4"  # or "claude-3-opus", "command-r-plus"
    max_tokens: 1000
    temperature: 0.7

# Trading Parameters
trading:
  symbols:
    - "BTCUSDT"
    - "ETHUSDT"
    - "BNBUSDT"
  
  timeframes:
    - "1h"
    - "4h"
    - "1d"
  
  capital:
    initial: 10000  # USD
    max_position_size: 0.1  # 10% of capital per trade
    reserve_ratio: 0.2  # Keep 20% in reserve

# Model Configuration
model:
  lstm:
    sequence_length: 60
    hidden_size: 128
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.001
    batch_size: 32
    epochs: 100
  
  features:
    - "close"
    - "volume"
    - "rsi"
    - "macd"
    - "bb_upper"
    - "bb_lower"

# Risk Management
risk:
  max_drawdown: 0.15  # 15%
  stop_loss: 0.02  # 2% per trade
  take_profit: 0.04  # 4% per trade
  max_daily_trades: 10
  max_open_positions: 3
  
  position_sizing:
    method: "kelly"  # or "fixed", "volatility"
    kelly_fraction: 0.25  # Conservative Kelly

# Data Configuration
data:
  storage_path: "./data"
  cache_enabled: true
  historical_days: 365
  update_interval: 300  # seconds

# Backtesting
backtest:
  start_date: "2023-01-01"
  end_date: "2024-01-01"
  commission: 0.001  # 0.1%
  slippage: 0.0005  # 0.05%

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "./logs/trading.log"
  max_size: 10485760  # 10MB
  backup_count: 5

# Dashboard
dashboard:
  host: "0.0.0.0"
  port: 8050
  debug: false
  update_interval: 5000  # milliseconds
